# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  BIN_NAME: "go-docker-clock"
  IMAGE_ID: "go-docker-clock"
  CONTAINER_NAME: "goDockerClock"

tasks:
  default:
    cmds:
      - task: audit
      - task: test
      - task: lint
      - task: fmt
      # - task: run

  run:
    desc: Run excellent Go program
    cmds:
      - go run .

  start:
    desc: Start the application
    cmds:
      - task: kill
      - sh -c 'go run . & echo "$!" > tmp.pid'
  kill:
    desc: Kill the application
    cmds:
      - sh -c 'if [ -f tmp.pid ]; then kill "$(cat tmp.pid)"; rm tmp.pid; fi'
  stop:
    desc: Stop the application
    cmds:
      - task: kill

  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  format:
    desc: Format Go code (alias)
    cmds:
      - task: fmt

  test:
    desc: Test Go code
    cmds:
      - go test -v

  build-go:
    desc: Build the Go binary for Linux AMD64
    cmds:
      - rm -f "{{.BIN_NAME}}"
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "{{.BIN_NAME}}" -ldflags="-w -s" -trimpath main.go
      - upx --best "{{.BIN_NAME}}"
  start-go:
    desc: Start the application
    cmds:
      - task: kill
      - sh -c './{{.BIN_NAME}} & echo "$!" > tmp.pid'

  build-docker:
    desc: Build Docker image
    cmds:
      - docker build ./ -t "{{.IMAGE_ID}}"
      - docker image list "{{.IMAGE_ID}}"

  start-docker:
    desc: Run Docker container
    cmds :
      - docker run --name "{{.CONTAINER_NAME}}" --rm -d -p 8080:8080 "{{.IMAGE_ID}}"

  stop-docker:
    desc: Stop Docker container
    cmds:
      - docker stop "{{.CONTAINER_NAME}}"

  smoke-test:
    desc: Run smoke tests
    cmds:
      - ./smoke-test.sh

  lint-go:
    desc: Lint Go code
    cmds:
      - go vet ./...
      - golangci-lint run

  lint-dockerfile:
    desc: Lint Dockerfile
    cmds:
      - hadolint ./Dockerfile

  audit-go:
    desc: Audit Go code
    cmds:
      - govulncheck ./...

  update-go:
    desc: Update Go dependencies
    cmds:
      - go get -u ./...
      - go mod tidy

  update-aqua:
    desc: Update Aqua dependencies
    cmds:
      - aqua update-aqua
      - aqua update
      - aqua vacuum

  pinact-update:
    desc: Update GitHub Actions (both workflows and actions)
    cmds:
      - pinact run --update

  lint-actions:
    desc: Lint GitHub Actions
    cmds:
      - find -name action.yml -o -name action.yaml | xargs action-validator -v

  lint-workflows:
    desc: Lint GitHub Workflows
    cmds:
      - actionlint --verbose

  # lint-workflows-docker:
  #   desc: Lint GitHub Workflows with Docker
  #   cmds:
  #     - docker run --rm -v "$(pwd):$(pwd)" -w "$(pwd)" rhysd/actionlint:latest --verbose

  lint:
    desc: Lint all
    cmds:
      - task: lint-go
      - task: lint-dockerfile
      - task: lint-workflows
      # - task: lint-actions

  audit:
    desc: Audit all
    cmds:
      - task: audit-go

  trivy:
    desc: Scan Docker image with Trivy
    cmds:
      - trivy image --severity HIGH,CRITICAL "{{.IMAGE_ID}}"
      - trivy fs --severity HIGH,CRITICAL .
